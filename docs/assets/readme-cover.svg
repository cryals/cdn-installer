<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">VPN CDN Installer</title>
  <desc id="desc">A dark cover with an abstract route through a CDN to an origin server.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171a20"/><stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#626a78"/><stop offset=".5" stop-color="#f3f4f6"/><stop offset="1" stop-color="#626a78"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="76" fill="#a7adb7" font-size="15" font-weight="700" letter-spacing="4">SELF-HOSTED INFRASTRUCTURE</text>
    <text x="60" y="160" fill="#f5f5f5" font-size="64" font-weight="700" letter-spacing="-2">VPN CDN</text>
    <text x="60" y="222" fill="#f5f5f5" font-size="64" font-weight="700" letter-spacing="-2">INSTALLER<tspan fill="#727a87">.</tspan></text>
    <text x="64" y="270" fill="#a7adb7" font-size="19">Panel  /  CDN origin  /  nodes</text>
    <text x="64" y="348" fill="#7e8693" font-size="14" letter-spacing="2">REMNAWAVE   ·   3X-UI</text>
    <text x="1138" y="348" text-anchor="end" fill="#7e8693" font-size="14" letter-spacing="2">V 3 . 0</text>
    <path d="M680 170H1090" fill="none" stroke="url(#route)" stroke-width="2"/>
    <path d="M680 170L768 100H990L1090 170M680 170L768 240H990L1090 170" fill="none" stroke="#f5f5f5" stroke-opacity=".11"/>
    <g fill="#101216" stroke="#717987" stroke-width="1.5">
      <rect x="625" y="137" width="110" height="66" rx="9"/>
      <rect x="815" y="127" width="130" height="86" rx="10"/>
      <rect x="1035" y="137" width="110" height="66" rx="9"/>
    </g>
    <g text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#e8e9ed">
      <text x="680" y="175">CLIENT</text><text x="880" y="175">CDN</text><text x="1090" y="175">ORIGIN</text>
    </g>
    <g fill="#d4d8df"><circle cx="768" cy="100" r="3"/><circle cx="990" cy="100" r="3"/><circle cx="768" cy="240" r="3"/><circle cx="990" cy="240" r="3"/></g>
  </g>
</svg>
